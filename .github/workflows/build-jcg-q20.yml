name: Build OpenWrt JCG Q20

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v23.05.6-jcgq20-r1"
        required: true
        default: "v23.05.6-jcgq20-r1"
        type: string

      publish_release:
        description: "Create or update GitHub Release"
        required: true
        default: true
        type: boolean

  push:
    tags:
      - "v23.05.6-jcgq20-r*"

permissions:
  contents: write

env:
  OPENWRT_VERSION: "23.05.6"
  OPENWRT_TAG: "v23.05.6"

  PROFILE: "jcg_q20_cr6606"

  TZ: "Asia/Shanghai"
  DEBIAN_FRONTEND: "noninteractive"

concurrency:
  group: openwrt-jcg-q20-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 1. Checkout your customization repository
      # ======================================================

      - name: Checkout customization repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ======================================================
      # 2. Build dependencies
      # ======================================================

      - name: Install build dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libelf-dev \
            libpython3-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            device-tree-compiler \
            ccache \
            time


      # ======================================================
      # 3. Clone EXACT OpenWrt 23.05.6
      # ======================================================

      - name: Clone exact OpenWrt 23.05.6
        run: |

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          echo "OpenWrt tag:"
          git describe --tags --exact-match

          echo "OpenWrt commit:"
          git rev-parse HEAD


      # ======================================================
      # 4. Official OpenWrt feeds
      # ======================================================

      - name: Update official OpenWrt feeds
        working-directory: openwrt
        run: |

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ======================================================
      # 5. Apply JCG Q20 modifications
      # ======================================================

      - name: Apply JCG Q20 hardware customization
        run: |

          chmod +x scripts/apply-jcg-q20.sh

          ./scripts/apply-jcg-q20.sh openwrt


      # ======================================================
      # 6. Load config
      # ======================================================

      - name: Load JCG Q20 configuration
        working-directory: openwrt
        run: |

          cp \
            ../config/jcg-q20-23.05.6.config \
            .config

          make defconfig


      # ======================================================
      # 7. Verify configuration
      # ======================================================

      - name: Verify target and DTS
        working-directory: openwrt
        run: |

          echo
          echo "============================================"
          echo "TARGET PROFILE"
          echo "============================================"

          grep \
            '^CONFIG_TARGET_.*DEVICE.*=y' \
            .config

          echo
          echo "============================================"
          echo "IMAGE PROFILE"
          echo "============================================"

          grep -n \
            -A8 \
            -B2 \
            'define Device/jcg_q20_cr6606' \
            target/linux/ramips/image/mt7621.mk

          echo
          echo "============================================"
          echo "DTS"
          echo "============================================"

          sed -n \
            '1,220p' \
            target/linux/ramips/dts/mt7621_jcg_q20_cr6606.dts

          echo
          echo "============================================"
          echo "NETWORK BOARD"
          echo "============================================"

          grep -n \
            -A4 \
            -B2 \
            'jcg,q20-cr6606)' \
            target/linux/ramips/mt7621/base-files/etc/board.d/02_network


      # ======================================================
      # 8. Download sources first
      # ======================================================

      - name: Download package sources
        working-directory: openwrt
        run: |

          make download -j8

          find dl \
            -type f \
            -size -1024c \
            -print \
            -delete


      # ======================================================
      # 9. Build
      # ======================================================

      - name: Build OpenWrt
        working-directory: openwrt
        run: |

          echo "CPU threads:"
          nproc

          make \
            -j"$(nproc)" \
            V=s \
            || make \
            -j1 \
            V=s


      # ======================================================
      # 10. Verify firmware
      # ======================================================

      - name: Collect generated firmware
        working-directory: openwrt
        run: |

          OUTDIR="bin/targets/ramips/mt7621"

          test -d "$OUTDIR"

          echo
          echo "============================================"
          echo "TARGET OUTPUT"
          echo "============================================"

          ls -lah "$OUTDIR"

          mapfile -t FILES < <(
            find "$OUTDIR" \
              -maxdepth 1 \
              -type f \
              \( \
                -name '*jcg_q20_cr6606*.bin' \
                -o \
                -name '*jcg_q20_cr6606*.json' \
              \) \
              -print
          )

          test "${#FILES[@]}" -gt 0

          mkdir -p ../release

          cp \
            "${FILES[@]}" \
            ../release/

          # Build metadata
          for f in \
            profiles.json \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo
          do

            if [ -f "$OUTDIR/$f" ]; then
              cp \
                "$OUTDIR/$f" \
                ../release/
            fi

          done

          cd ../release

          sha256sum \
            *.bin \
            > SHA256SUMS


      # ======================================================
      # 11. Release metadata
      # ======================================================

      - name: Prepare release metadata
        id: release_meta

        env:

          MANUAL_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}

          PUBLISH: ${{ inputs.publish_release }}

        run: |

          if [ "$EVENT_NAME" = "push" ]; then

            RELEASE_TAG="$EVENT_TAG"
            SHOULD_PUBLISH=true

          else

            RELEASE_TAG="$MANUAL_TAG"
            SHOULD_PUBLISH="$PUBLISH"

          fi


          case "$RELEASE_TAG" in

            v23.05.6-jcgq20-r*)
              ;;

            *)
              echo "Invalid release tag:"
              echo "$RELEASE_TAG"
              exit 1
              ;;

          esac


          echo \
            "release_tag=$RELEASE_TAG" \
            >> "$GITHUB_OUTPUT"

          echo \
            "should_publish=$SHOULD_PUBLISH" \
            >> "$GITHUB_OUTPUT"


          cat > release/BUILD_INFO.txt <<EOF

Project: upleung/OpenWrt-JCG-Q20

OpenWrt version:
${OPENWRT_VERSION}

OpenWrt tag:
${OPENWRT_TAG}

Profile:
${PROFILE}

Runtime model:
JCG Q20

Runtime board:
jcg,q20-cr6606

Physical port mapping:

WAN:
switch port@0 -> wan

LAN1:
switch port@1 -> lan1

LAN2:
gmac1 / PHY4 -> lan2

Unused:
switch port@2

Build commit:
${GITHUB_SHA}

Build time UTC:
$(date -u '+%Y-%m-%d %H:%M:%S')

EOF


      # ======================================================
      # 12. Actions artifact
      # ======================================================

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4

        with:

          name: >
            OpenWrt-${{ env.OPENWRT_VERSION }}-JCG-Q20

          path: |
            release/

          if-no-files-found: error

          retention-days: 30


      # ======================================================
      # 13. Create / update GitHub Release
      # ======================================================

      - name: Create or update GitHub Release

        if:
          steps.release_meta.outputs.should_publish == 'true'

        env:

          GH_TOKEN: ${{ github.token }}

          RELEASE_TAG:
            ${{ steps.release_meta.outputs.release_tag }}

        run: |

          if gh release view "$RELEASE_TAG" \
            >/dev/null 2>&1
          then

            echo "Release exists:"
            echo "$RELEASE_TAG"

            gh release upload \
              "$RELEASE_TAG" \
              release/* \
              --clobber

          else

            echo "Create release:"
            echo "$RELEASE_TAG"

            gh release create \
              "$RELEASE_TAG" \
              release/* \
              --target "$GITHUB_SHA" \
              --title \
                "OpenWrt ${OPENWRT_VERSION} - JCG Q20 ${RELEASE_TAG#v}" \
              --notes \
                "Official OpenWrt ${OPENWRT_VERSION} source.

Physical port mapping:

WAN -> wan
LAN1 -> lan1
LAN2 -> lan2

This firmware keeps the CR660x NAND/image architecture,
factory MAC/EEPROM handling, and other CR660x hardware
definitions. Only the JCG Q20 identity and verified
three-port mapping are adapted.

See BUILD_INFO.txt and SHA256SUMS." \
              --latest

          fi
name: Build OpenWrt JCG Q20

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v23.05.6-jcgq20-r1"
        required: true
        default: "v23.05.6-jcgq20-r1"
        type: string
      publish_release:
        description: "Create/update GitHub Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v23.05.6-jcgq20-r*"

permissions:
  contents: write

env:
  OPENWRT_VERSION: "23.05.6"
  OPENWRT_TAG: "v23.05.6"
  PROFILE: "jcg_q20_cr6606"
  TZ: "Asia/Shanghai"
  DEBIAN_FRONTEND: "noninteractive"

concurrency:
  group: openwrt-jcg-q20-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev libelf-dev libpython3-dev \
            python3 python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget curl device-tree-compiler ccache time

      - name: Clone exact OpenWrt 23.05.6 source
        run: |
          git clone --depth 1 --branch "${OPENWRT_TAG}" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          test "$(git describe --tags --exact-match 2>/dev/null)" = "${OPENWRT_TAG}"
          echo "OpenWrt source: $(git rev-parse HEAD)"

      - name: Update and install official OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply JCG Q20 hardware customization
        run: |
          bash scripts/apply-jcg-q20.sh openwrt

      - name: Load build configuration
        working-directory: openwrt
        run: |
          cp ../config/jcg-q20-23.05.6.config .config
          make defconfig

      - name: Verify final target and customization
        working-directory: openwrt
        run: |
          echo "==== TARGET DEVICE ===="
          grep '^CONFIG_TARGET_.*DEVICE.*=y' .config
          echo "==== CUSTOM PROFILE ===="
          grep -n 'jcg_q20_cr6606' target/linux/ramips/image/mt7621.mk
          echo "==== CUSTOM BOARD ===="
          grep -R -n 'jcg,q20-cr6606' \
            target/linux/ramips/dts/mt7621_jcg_q20_cr6606.dts \
            target/linux/ramips/mt7621/base-files/etc/board.d/01_leds \
            target/linux/ramips/mt7621/base-files/etc/board.d/02_network
          echo "==== DTS PORT MAPPING ===="
          grep -n -A5 -B1 'port@0\|port@1\|port@2' \
            target/linux/ramips/dts/mt7621_jcg_q20_cr6606.dts
          grep -n -A6 -B2 '&gmac1' \
            target/linux/ramips/dts/mt7621_jcg_q20_cr6606.dts

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -type f -size -1024c -print -delete

      - name: Build OpenWrt
        working-directory: openwrt
        run: |
          echo "Build threads: $(nproc)"
          make -j"$(nproc)" V=s || make -j1 V=s

      - name: Collect and verify generated firmware
        working-directory: openwrt
        run: |
          OUTDIR="bin/targets/ramips/mt7621"
          test -d "$OUTDIR"
          ls -lah "$OUTDIR"
          mapfile -t files < <(find "$OUTDIR" -maxdepth 1 -type f \
            \( -name '*jcg_q20_cr6606*.bin' -o -name '*jcg_q20_cr6606*.json' \) -print)
          test "${#files[@]}" -gt 0

          mkdir -p ../release
          cp "${files[@]}" ../release/
          for f in profiles.json config.buildinfo feeds.buildinfo version.buildinfo; do
            [ -f "$OUTDIR/$f" ] && cp "$OUTDIR/$f" ../release/
          done
          cd ../release
          sha256sum *.bin > SHA256SUMS
          ls -lah

      - name: Prepare release metadata
        id: release_meta
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          PUBLISH: ${{ inputs.publish_release }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$EVENT_TAG"
            SHOULD_PUBLISH=true
          else
            RELEASE_TAG="$MANUAL_TAG"
            SHOULD_PUBLISH="$PUBLISH"
          fi

          case "$RELEASE_TAG" in
            v23.05.6-jcgq20-r*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG"; exit 1 ;;
          esac

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

          cat > release/BUILD_INFO.txt <<EOFINFO
Project: upleung/OpenWrt-JCG-Q20
OpenWrt: ${OPENWRT_VERSION}
OpenWrt tag: ${OPENWRT_TAG}
Profile: ${PROFILE}
Runtime model: JCG Q20
Runtime board: jcg,q20-cr6606
Physical WAN: switch port@0 -> wan
Physical LAN1: switch port@1 -> lan1
Physical LAN2: gmac1/PHY4 -> lan2
Build commit: ${GITHUB_SHA}
Build time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')
EOFINFO

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-${{ env.OPENWRT_VERSION }}-JCG-Q20
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: steps.release_meta.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "OpenWrt ${OPENWRT_VERSION} - JCG Q20 ${RELEASE_TAG#v}" \
              --notes "OpenWrt 23.05.6 official source, adapted for JCG Q20 model identity and the verified three-port mapping.\n\nMapping:\n- WAN -> wan\n- LAN1 -> lan1\n- LAN2 -> lan2\n\nCR6606 NAND/image recipe and factory MAC/EEPROM handling are retained. See BUILD_INFO.txt and SHA256SUMS." \
              --latest

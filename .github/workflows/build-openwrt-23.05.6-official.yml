name: Build OpenWrt JCG Q20 (CR6606 Base)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v23.05.6-jcgq20-r1)"
        required: true
        default: "v23.05.6-jcgq20-r1"
        type: string
  push:
    tags:
      - "v23.05.6-jcgq20-r*"

permissions:
  contents: write

env:
  OPENWRT_TAG: "v23.05.6"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: 安装编译环境
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler
      
      - name: 拉取官方 23.05.6 源码
        run: git clone --depth 1 --branch "${OPENWRT_TAG}" https://github.com/openwrt/openwrt.git openwrt
      
      - name: 更新 Feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a
      
      - name: 注入端口补丁 (就地篡改)
        run: chmod +x scripts/apply-jcg-q20.sh && ./scripts/apply-jcg-q20.sh openwrt
      
      - name: 加载编译配置
        working-directory: openwrt
        run: cp ../config/official.config .config && make defconfig
      
      - name: 下载依赖并编译
        working-directory: openwrt
        run: |
          make download -j8
          make -j"$(nproc)" V=s || make -j1 V=s
      
      - name: 收集并验证固件 (Collect and verify firmware)
        working-directory: openwrt
        run: |
          set -euo pipefail
          
          OUTDIR="bin/targets/ramips/mt7621"
          
          # 1. 检查输出目录是否存在
          if [ ! -d "$OUTDIR" ]; then
            echo "致命错误：输出目录 $OUTDIR 不存在！说明前面 make 编译彻底失败。"
            exit 1
          fi
          
          echo "==== 打印所有编译输出的文件 ===="
          find "$OUTDIR" -maxdepth 2 -type f -printf '%P\n' | sort
          
          echo "==== 筛选固件候选文件 ===="
          # 完美融合方案 C：自动抓取当前目录下所有的 .bin 和 .json 文件，无视设备代号
          mapfile -t FW_FILES < <(
            find "$OUTDIR" -maxdepth 1 -type f \( -name '*.bin' -o -name '*.json' \) -print | sort
          )
          
          # 2. 严格校验是否生成了固件
          if [ "${#FW_FILES[@]}" -eq 0 ]; then
            echo "致命错误：没有检测到任何生成的 .bin 固件！"
            echo "请往上翻看 'Build OpenWrt' 步骤的报错日志。"
            exit 1
          fi
          
          # 3. 复制固件到 release 目录
          mkdir -p ../release
          cp "${FW_FILES[@]}" ../release/
          
          # 4. 提取实用的编译元数据 (便于日后排查和记录)
          for f in \
            profiles.json \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo
          do
            if [ -f "$OUTDIR/$f" ]; then
              cp "$OUTDIR/$f" ../release/
            fi
          done
          
          # 5. 生成 SHA256 校验和
          cd ../release
          sha256sum -- *.bin > SHA256SUMS
          
          echo "==== 最终准备发布的 Release 文件列表 ===="
          ls -lah
      
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$TAG" release/* --title "OpenWrt 23.05.6 - JCG Q20" --notes "基于 CR6606 原版源码，已完美修复物理 WAN/LAN 错位。" --latest || gh release upload "$TAG" release/* --clobber
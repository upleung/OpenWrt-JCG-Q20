name: Build OpenWrt JCG Q20 V1 TEST

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v23.05.6-jcgq20-r1"
        required: true
        default: "v23.05.6-jcgq20-r1"
        type: string
      publish_release:
        description: "Create or update GitHub Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v23.05.6-jcgq20-r*"

permissions:
  contents: write

env:
  OPENWRT_VERSION: "23.05.6"
  OPENWRT_TAG: "v23.05.6"
  PROFILE: "jcg_q20_cr6606"
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler
      - name: Clone OpenWrt 23.05.6
        run: git clone --depth 1 --branch "${OPENWRT_TAG}" https://github.com/openwrt/openwrt.git openwrt
      - name: Update feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a
      - name: Apply JCG Q20 customization
        run: chmod +x scripts/apply-jcg-q20.sh && ./scripts/apply-jcg-q20.sh openwrt
      - name: Load config
        working-directory: openwrt
        run: cp ../config/jcg-q20-23.05.6.config .config && make defconfig
      - name: Download package sources
        working-directory: openwrt
        run: make download -j8
      - name: Build OpenWrt
        working-directory: openwrt
        run: make -j"$(nproc)" V=s || make -j1 V=s
        
      - name: 收集并验证固件 (Collect and verify firmware)
        working-directory: openwrt
        run: |
          set -euo pipefail
          
          OUTDIR="bin/targets/ramips/mt7621"
          
          # 1. 检查输出目录是否存在
          if [ ! -d "$OUTDIR" ]; then
            echo "致命错误：输出目录 $OUTDIR 不存在！说明前面 make 编译彻底失败。"
            exit 1
          fi
          
          echo "==== 打印所有编译输出的文件 ===="
          find "$OUTDIR" -maxdepth 2 -type f -printf '%P\n' | sort
          
          echo "==== 筛选固件候选文件 ===="
          # 自动抓取当前目录下所有的 .bin 和 .json 文件，无视设备代号
          mapfile -t FW_FILES < <(
            find "$OUTDIR" -maxdepth 1 -type f \( -name '*.bin' -o -name '*.json' \) -print | sort
          )
          
          # 2. 严格校验是否生成了固件
          if [ "${#FW_FILES[@]}" -eq 0 ]; then
            echo "致命错误：没有检测到任何生成的 .bin 固件！"
            echo "请往上翻看 'Build OpenWrt' 步骤的报错日志。"
            exit 1
          fi
          
          # 3. 复制固件到 release 目录
          mkdir -p ../release
          cp "${FW_FILES[@]}" ../release/
          
          # 4. 提取实用的编译元数据 (便于日后排查和记录)
          for f in \
            profiles.json \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo
          do
            if [ -f "$OUTDIR/$f" ]; then
              cp "$OUTDIR/$f" ../release/
            fi
          done
          
          # 5. 生成 SHA256 校验和
          cd ../release
          sha256sum -- *.bin > SHA256SUMS
          
          echo "==== 最终准备发布的 Release 文件列表 ===="
          ls -lah
          
      - name: 准备元数据 (Prepare metadata)
        id: meta
        run: |
          echo "tag=${{ inputs.release_tag || github.ref_name }}" >> $GITHUB_OUTPUT
          echo "publish=${{ inputs.publish_release || 'true' }}" >> $GITHUB_OUTPUT
          
      - name: 发布到 GitHub Releases (V1 测试版)
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" release/* \
            --title "OpenWrt 23.05.6 - JCG Q20 [V1 测试版]" \
            --notes "⚠️ **此为初版测试固件 (V1 Beta)**<br><br>**测试重点：**<br>1. 验证 GitHub Actions 自动化编译流程是否跑通。<br>2. 验证方案 C（固件无差别抓取）是否成功提取文件。<br><br>基于官方 23.05.6 源码编译。" \
            --prerelease || \
          gh release upload "$TAG" release/* --clobber

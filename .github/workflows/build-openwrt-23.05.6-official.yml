name: Build OpenWrt JCG Q20

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v23.05.6-jcgq20-r1"
        required: true
        default: "v23.05.6-jcgq20-r1"
        type: string
      publish_release:
        description: "Create or update GitHub Release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v23.05.6-jcgq20-r*"

permissions:
  contents: write

env:
  OPENWRT_VERSION: "23.05.6"
  OPENWRT_TAG: "v23.05.6"
  PROFILE: "jcg_q20_cr6606"
  DEBIAN_FRONTEND: "noninteractive"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget device-tree-compiler
      - name: Clone OpenWrt 23.05.6
        run: git clone --depth 1 --branch "${OPENWRT_TAG}" https://github.com/openwrt/openwrt.git openwrt
      - name: Update feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a
      - name: Apply JCG Q20 customization
        run: chmod +x scripts/apply-jcg-q20.sh && ./scripts/apply-jcg-q20.sh openwrt
      - name: Load config
        working-directory: openwrt
        run: cp ../config/jcg-q20-23.05.6.config .config && make defconfig
      - name: Download package sources
        working-directory: openwrt
        run: make download -j8
      - name: Build OpenWrt
        working-directory: openwrt
        run: make -j"$(nproc)" V=s || make -j1 V=s
      - name: Collect firmware
        working-directory: openwrt
        run: |
          mkdir -p ../release
          cp bin/targets/ramips/mt7621/*jcg_q20_cr6606*.bin ../release/
          cd ../release && sha256sum *.bin > SHA256SUMS
      - name: Prepare metadata
        id: meta
        run: |
          echo "tag=${{ inputs.release_tag || github.ref_name }}" >> $GITHUB_OUTPUT
          echo "publish=${{ inputs.publish_release || 'true' }}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release create "$TAG" release/* --title "OpenWrt 23.05.6 - JCG Q20 ${TAG#v}" --notes "WAN -> wan | LAN1 -> lan1 | LAN2 -> lan2. Built from official 23.05.6 source." --latest || gh release upload "$TAG" release/* --clobber